version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: volunteerhub-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: volunteer_hub
      MYSQL_USER: ${MYSQL_USER:-volunteer}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-volunteerpass}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - volunteerhub-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volunteerhub-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/volunteer_hub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-volunteer}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-volunteerpass}
      SPRING_SQL_INIT_MODE: never
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./images:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - volunteerhub-network
    restart: unless-stopped

networks:
  volunteerhub-network:
    driver: bridge

volumes:
  mysql_data:
  uploaded-files:

