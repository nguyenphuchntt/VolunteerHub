version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: volunteerhub-postgres
    environment:
      POSTGRES_DB: volunteer_hub
      POSTGRES_USER: ${POSTGRES_USER:-volunteer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volunteerpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - volunteerhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-volunteer} -d ${POSTGRES_DB:-volunteer_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  redis:
    image: redis:7-alpine
    container_name: volunteerhub-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - volunteerhub-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volunteerhub-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/volunteer_hub
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-volunteer}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-volunteerpass}
      SPRING_SQL_INIT_MODE: never
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      UPLOAD_DIR: /app/uploads
      # Redis configuration
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Email configuration for password reset
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Password reset configuration
      PASSWORD_RESET_FRONTEND_URL: ${PASSWORD_RESET_FRONTEND_URL:-http://localhost:5173/reset-password}
      # Email verification configuration
      EMAIL_VERIFICATION_FRONTEND_URL: ${EMAIL_VERIFICATION_FRONTEND_URL:-http://localhost:5173/verify-email}
    volumes:
      - uploaded-files:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - volunteerhub-network
    restart: unless-stopped

networks:
  volunteerhub-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploaded-files:

