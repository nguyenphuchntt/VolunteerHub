<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCM Test - VolunteerHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>🔔 FCM Test - VolunteerHub</h1>

        <!-- Status Bar -->
        <div id="status-bar" class="status-bar">
            <span id="login-status">❌ Chưa đăng nhập</span>
            <span id="fcm-status">❌ Chưa subscribe FCM</span>
        </div>

        <!-- Login Section -->
        <section class="card">
            <h2>1. Đăng nhập</h2>
            <div class="form-group">
                <input type="text" id="username" placeholder="Username hoặc Email">
                <input type="password" id="password" placeholder="Password">
                <button id="btn-login" onclick="login()">Đăng nhập</button>
            </div>
            <div id="login-result" class="result"></div>
        </section>

        <!-- FCM Subscribe Section -->
        <section class="card">
            <h2>2. Push Notifications</h2>
            <p class="info">Click "Subscribe" để xin quyền notification và lấy FCM token</p>
            <div class="button-group">
                <button id="btn-subscribe" onclick="subscribeFCM()" disabled>Subscribe</button>
                <button id="btn-unsubscribe" onclick="unsubscribeFCM()" disabled>Unsubscribe</button>
                <button id="btn-unsubscribe-all" onclick="unsubscribeAllFCM()" disabled>Unsubscribe All</button>
            </div>
            <div id="fcm-result" class="result"></div>
            <div id="fcm-token-display" class="token-display"></div>
        </section>

        <!-- Join Event Section -->
        <section class="card">
            <h2>3. Đăng ký Event</h2>
            <div class="form-group">
                <input type="number" id="event-id" placeholder="Event ID (số)">
                <input type="text" id="event-note" placeholder="Ghi chú (tùy chọn)">
                <button id="btn-join-event" onclick="joinEvent()" disabled>Đăng ký</button>
            </div>
            <div id="event-result" class="result"></div>
        </section>

        <!-- Request Manager Section -->
        <section class="card">
            <h2>4. Xin làm Manager</h2>
            <div class="form-group">
                <textarea id="request-reason" placeholder="Lý do xin làm manager..."></textarea>
                <button id="btn-request-manager" onclick="requestManager()" disabled>Gửi Request</button>
            </div>
            <div id="request-result" class="result"></div>
        </section>

        <!-- Test Send Notification -->
        <section class="card">
            <h2>5. Test gửi Notification (cho chính mình)</h2>
            <div class="form-group">
                <input type="text" id="notif-content" placeholder="Nội dung notification">
                <button id="btn-send-notif" onclick="sendTestNotification()" disabled>Gửi Test</button>
            </div>
            <div id="notif-result" class="result"></div>
        </section>

        <!-- Logs -->
        <section class="card">
            <h2>📋 Logs</h2>
            <div id="logs" class="logs"></div>
            <button onclick="clearLogs()">Clear Logs</button>
        </section>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="app.js"></script>
</body>

</html>
