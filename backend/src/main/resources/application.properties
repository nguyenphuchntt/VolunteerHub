spring.application.name=VolunteerHub
spring.config.import=optional:file:.env[.properties]


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/volunteer_hub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

server.error.include-message=always
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR

springdoc.api-docs.path=/api-docs
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.validation-timeout=5000

server.base-url=http://localhost:8080
file.upload-dir=${UPLOAD_DIR:${user.home}/volunteer-hub-uploads}
file.max-size=10485760
file.allowed-extensions=jpg,jpeg,png,gif,bmp,webp,pdf,doc,docx,xls,xlsx,txt,zip,mp4,mp3
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

firebase.service-account=classpath:fcmkey.json
# ========== Redis Configuration ==========
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ========== Cache Configuration ==========
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# ========== Rate Limiting Configuration ==========
ratelimit.enabled=false
# Trust proxy headers (X-Forwarded-For, X-Real-IP) - set to true if behind reverse proxy
# WARNING: Only enable if app is behind a trusted proxy (Nginx, AWS ALB, etc.)
ratelimit.trust-proxy=false
# Default rate limit: 100 requests per 60 seconds
ratelimit.default.limit=100
ratelimit.default.duration-seconds=60
# Login endpoint: 5 requests per 60 seconds (anti brute-force)
ratelimit.login.limit=5
ratelimit.login.duration-seconds=60
# Register endpoint: 3 requests per 60 seconds (anti spam)
ratelimit.register.limit=3
ratelimit.register.duration-seconds=60
# Public endpoints: 50 requests per 60 seconds
ratelimit.public.limit=50
ratelimit.public.duration-seconds=60
# Forgot password endpoint: 3 requests per 60 seconds (anti spam)
ratelimit.forgot-password.limit=3
ratelimit.forgot-password.duration-seconds=60

# ========== Email Configuration ==========
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ========== Password Reset Configuration ==========
# Frontend URL for password reset page
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
# Token expiry time in minutes (default: 30 minutes)
app.password-reset.token-expiry-minutes=${PASSWORD_RESET_TOKEN_EXPIRY:30}
# Email sender name
app.password-reset.sender-name=${PASSWORD_RESET_SENDER_NAME:VolunteerHub}

# ========== Email Verification Configuration ==========
# Frontend URL for email verification page
app.email-verification.frontend-url=${EMAIL_VERIFICATION_FRONTEND_URL:http://localhost:5173/verify-email}
# Token expiry time in minutes (default: 24 hours = 1440 minutes)
app.email-verification.token-expiry-minutes=${EMAIL_VERIFICATION_TOKEN_EXPIRY:30}
