spring.application.name=VolunteerHub
spring.config.import=optional:file:.env[.properties]

spring.security.jwt.secret=${JWT_SECRET:VHjMY9aHcYibhaxEng0FQlURAsm1s9dsrHBppdhc1O/4lUMc5iinNGpJ2p8D7e3/D3TUVFk1jS8N6mtw1YlG5g==}
spring.security.jwt.access-token-expiration-time=${JWT_ACCESS_TOKEN_EXPIRATION_TIME:600000}
spring.security.jwt.refresh-token-expiration-time=${JWT_REFRESH_TOKEN_EXPIRATION_TIME:1209600000}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/volunteer_hub}
spring.datasource.username=${DB_USERNAME:volunteer}
spring.datasource.password=${DB_PASSWORD:volunteerpass}

# UTF-8 Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

server.error.include-message=always
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type=ERROR
logging.level.org.hibernate.orm.jdbc.bind=ERROR

springdoc.api-docs.path=/api-docs
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.validation-timeout=5000

server.base-url=http://localhost:8080
file.upload-dir=${UPLOAD_DIR:${user.home}/volunteer-hub-uploads}
file.max-size=10485760
file.allowed-extensions=jpg,jpeg,png,gif,bmp,webp,pdf,doc,docx,xls,xlsx,txt,zip,mp4,mp3
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

firebase.service-account=classpath:fcmkey.json
# ========== Redis Configuration ==========
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ========== Cache Configuration ==========
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# ========== Rate Limiting Configuration ==========
ratelimit.enabled=true

# Trust proxy headers (X-Forwarded-For, X-Real-IP)
# Only enable when the application is behind a trusted proxy
# such as Nginx or AWS ALB.
ratelimit.trust-proxy=false
# ========== Default ==========
# Bucket capacity: 100 tokens
ratelimit.default.capacity=100
ratelimit.default.duration-seconds=60
# ========== Login ==========
# Bucket capacity: 5 tokens
ratelimit.login.capacity=5
ratelimit.login.duration-seconds=60
# ========== Register ==========
# Bucket capacity: 3 tokens
ratelimit.register.capacity=3
ratelimit.register.duration-seconds=60
# ========== Public Endpoints ==========
# Bucket capacity: 50 tokens
ratelimit.public.capacity=50
ratelimit.public.duration-seconds=60
# ========== Forgot Password ==========
# Bucket capacity: 3 tokens
ratelimit.forgot-password.capacity=3
ratelimit.forgot-password.duration-seconds=60
# ========== Resend Verification ==========
# Bucket capacity: 3 tokens
ratelimit.resend-verification.capacity=3
ratelimit.resend-verification.duration-seconds=60
# ========== OTP Verification ==========
# Bucket capacity: 10 tokens
ratelimit.otp-verify.capacity=10
ratelimit.otp-verify.duration-seconds=60

# ========== Email Configuration ==========
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ========== Password Reset Configuration ==========
# Frontend URL for password reset page
app.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
# Token expiry time in minutes (default: 30 minutes)
app.password-reset.token-expiry-minutes=${PASSWORD_RESET_TOKEN_EXPIRY:30}
# Email sender name
app.password-reset.sender-name=${PASSWORD_RESET_SENDER_NAME:VolunteerHub}

# ========== One-Time Password (OTP) Configuration ==========
spring.mail.otp.pepper=${OTP_PEPPER:change-me-in-production}
# Number of digits in a generated code
spring.mail.otp.verification.length=6
# How long a code stays valid
spring.mail.otp.verification.expiry-minutes=5
# Wrong guesses allowed before the code is invalidated
spring.mail.otp.verification.max-attempts=5
# Minimum wait between two code requests for the same email
spring.mail.otp.verification.resend-cooldown-seconds=60
# Maximum codes that may be sent to one email within an hour
spring.mail.otp.verification.max-sends-per-hour=5
