spring.application.name=VolunteerHub
spring.config.import=optional:file:.env[.properties]


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/volunteer_hub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false


spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

springdoc.api-docs.path=/api-docs
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.validation-timeout=5000

server.base-url=http://localhost:8080
file.upload-dir=${user.home}/volunteer-hub-uploads
file.max-size=10485760
file.allowed-extensions=jpg,jpeg,png,gif,bmp,webp,pdf,doc,docx,xls,xlsx,txt,zip,mp4,mp3
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB